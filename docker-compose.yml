# One container. SQLite lives in the shopfront_data volume.
#   docker compose up -d --build
services:
  shopfront:
    build: .
    image: shopfront-mvp:latest
    container_name: shopfront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Change this after first login via Admin → Password
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
    volumes:
      - shopfront_data:/data

volumes:
  shopfront_data:
