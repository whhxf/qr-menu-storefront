# One container. SQLite and uploaded dish photos live in the shopfront_data volume.
#   docker compose up -d --build
# `docker compose down` keeps the volume. `docker compose down -v` deletes the menu.
services:
  shopfront:
    build: .
    image: shopfront:latest
    container_name: shopfront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # changeme cannot open the editor until it is replaced on first login.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      # PUBLIC_BASE_URL: "https://menu.example.com"
    volumes:
      - shopfront_data:/data

volumes:
  shopfront_data:
