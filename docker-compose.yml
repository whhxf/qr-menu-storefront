# Hostinger Deploy: point compose_url at the raw GitHub URL of this file.
# Example:
# https://www.hostinger.com/vps/docker-hostinger?compose_url=https://raw.githubusercontent.com/YOUR_USER/shopfront-mvp/main/docker-compose.yml&ref=YOUR_CODE
services:
  shopfront:
    build: .
    image: shopfront-mvp:latest
    container_name: shopfront
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      # Change this after first login via Admin → Password
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
    volumes:
      - shopfront_data:/data

volumes:
  shopfront_data:
